name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branch histories
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checksum-verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p .local/tools
          curl --fail --silent --show-error --location "${base}/${archive}" --output ".local/tools/${archive}"
          curl --fail --silent --show-error --location "${base}/gitleaks_${version}_checksums.txt" --output .local/tools/checksums.txt
          (cd .local/tools && grep " ${archive}$" checksums.txt | sha256sum --check --strict)
          tar -xzf ".local/tools/${archive}" -C .local/tools gitleaks
      - name: Scan every reachable commit with redaction
        run: node scripts/scan-secrets.mjs ./.local/tools/gitleaks
      - name: Verify detection with synthetic credentials
        run: node scripts/test-secret-scanner.mjs ./.local/tools/gitleaks
